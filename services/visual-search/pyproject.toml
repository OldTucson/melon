[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "melon-visual-search"
version = "0.1.0"
description = "Private visual-search service for Melon"
requires-python = ">=3.10,<3.13"
dependencies = [
  "alibabacloud-credentials",
  "alibabacloud-oss-v2",
  "fastapi",
  "numpy",
  "onnxruntime",
  "opencv-contrib-python-headless",
  "pillow",
  "pillow-heif",
  "pgvector",
  "psycopg[binary,pool]",
  "pydantic-settings",
  "python-multipart",
  "uvicorn",
]

[project.scripts]
melon-visual-search = "melon_visual_search.cli:main"

[dependency-groups]
dev = [
  "httpx",
  "mypy",
  "pytest",
  "pytest-asyncio",
  "ruff",
]
model = [
  "onnx",
  "optimum-onnx",
  "torch",
  "transformers",
]

[tool.hatch.build.targets.wheel]
packages = ["src/melon_visual_search"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
